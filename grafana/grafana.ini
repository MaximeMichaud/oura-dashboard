[server]
root_url = %(protocol)s://%(domain)s:%(http_port)s/

[auth.anonymous]
enabled = true
org_role = Viewer

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/01-overview.json

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[plugins]
preinstall_auto_update = false

[users]
default_theme = dark
