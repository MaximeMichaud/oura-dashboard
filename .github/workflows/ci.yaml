name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Ruff check - ingestion
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: check ingestion/

      - name: Ruff check - streamlit
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: check streamlit/

      - name: Ruff format check - ingestion
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: format --check ingestion/

      - name: Ruff format check - streamlit
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: format --check streamlit/

      - name: Hadolint - ingestion/Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: ingestion/Dockerfile

      - name: Hadolint - streamlit/Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: streamlit/Dockerfile

      - name: Validate Grafana dashboard JSONs
        run: |
          python -c "
          import json, sys, pathlib
          errors = []
          for f in sorted(pathlib.Path('grafana/provisioning/dashboards-json').glob('*.json')):
              try:
                  d = json.loads(f.read_text())
                  for field in ('uid', 'title', 'panels'):
                      if field not in d:
                          errors.append(f'{f.name}: missing {field}')
                  for p in d.get('panels', []):
                      ds = p.get('datasource', {})
                      if isinstance(ds, dict) and ds.get('uid') and ds['uid'] != 'oura-pg':
                          errors.append(f'{f.name}: panel {p.get(\"id\")} bad datasource {ds[\"uid\"]}')
              except json.JSONDecodeError as e:
                  errors.append(f'{f.name}: invalid JSON - {e}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('All dashboard JSONs valid')
          "

      - name: YAML lint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: "."
          config_data: |
            extends: default
            rules:
              document-start: disable
              line-length:
                max: 200
              truthy:
                check-keys: false
              comments:
                min-spaces-from-content: 1

      - name: SQL lint - postgres/init.sql
        run: |
          python -c "
          import sys, pathlib, re
          sql = pathlib.Path('postgres/init.sql').read_text()
          errors = []
          lines = sql.splitlines()
          for i, line in enumerate(lines, 1):
              stripped = line.rstrip()
              if len(stripped) > 200:
                  errors.append(f'Line {i}: exceeds 200 chars ({len(stripped)})')
              if '\t' in line and not line.strip().startswith('--'):
                  errors.append(f'Line {i}: contains tab characters (use spaces)')
          if not sql.strip():
              errors.append('File is empty')
          if not re.search(r'CREATE\s+TABLE', sql, re.IGNORECASE):
              errors.append('No CREATE TABLE statements found')
          parens = 0
          for i, ch in enumerate(sql):
              if ch == '(':
                  parens += 1
              elif ch == ')':
                  parens -= 1
              if parens < 0:
                  errors.append(f'Unmatched closing parenthesis near character {i}')
                  break
          if parens > 0:
              errors.append(f'Unclosed parentheses: {parens} still open at end of file')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('SQL validation passed')
          "

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.5"
          allow-prereleases: true
          cache: pip
          cache-dependency-path: ingestion/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r ingestion/requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=oura_ingest \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  build:
    name: Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build all images
        run: |
          DOCKER_BUILDKIT=1 docker compose build \
            --build-arg BUILDKIT_INLINE_CACHE=1
        env:
          COMPOSE_DOCKER_CLI_BUILD: 1

  integration:
    name: Integration
    needs: [build]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: oura
          POSTGRES_USER: oura
          POSTGRES_PASSWORD: oura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oura"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client > /dev/null

      - name: Apply schema
        run: PGPASSWORD=oura psql -h localhost -U oura -d oura -f postgres/init.sql

      - name: Verify tables
        run: |
          TABLE_COUNT=$(PGPASSWORD=oura psql -h localhost -U oura -d oura -t -c \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE'" | xargs)
          echo "Tables found: $TABLE_COUNT"
          [ "$TABLE_COUNT" -eq 13 ] || { echo "Expected 13 tables, got $TABLE_COUNT"; exit 1; }

      - name: Verify indexes
        run: |
          INDEX_COUNT=$(PGPASSWORD=oura psql -h localhost -U oura -d oura -t -c \
            "SELECT count(*) FROM pg_indexes WHERE schemaname = 'public'" | xargs)
          echo "Indexes found: $INDEX_COUNT"
          [ "$INDEX_COUNT" -ge 16 ] || { echo "Expected at least 16 indexes, got $INDEX_COUNT"; exit 1; }

      - name: Verify idempotency
        run: PGPASSWORD=oura psql -h localhost -U oura -d oura -f postgres/init.sql

      - name: Start Grafana
        run: |
          docker run -d --name grafana \
            --network host \
            -v ${{ github.workspace }}/grafana/grafana.ini:/etc/grafana/grafana.ini:ro \
            -v ${{ github.workspace }}/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro \
            -v ${{ github.workspace }}/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro \
            -v ${{ github.workspace }}/grafana/provisioning/dashboards-json:/var/lib/grafana/dashboards:ro \
            -e GF_SECURITY_ADMIN_USER=admin \
            -e GF_SECURITY_ADMIN_PASSWORD=admin \
            grafana/grafana:12.4.2

      - name: Wait for Grafana
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Grafana ready"
              exit 0
            fi
            sleep 2
          done
          echo "Grafana did not become ready in time"
          exit 1

      - name: Verify dashboards loaded
        run: |
          DASH_COUNT=$(curl -sf -u admin:admin http://localhost:3000/api/search?type=dash-db | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          echo "Dashboards loaded: $DASH_COUNT"
          [ "$DASH_COUNT" -ge 5 ] || { echo "Expected at least 5 dashboards, got $DASH_COUNT"; exit 1; }

      - name: Build and start Streamlit container
        run: |
          docker build -t oura-streamlit ./streamlit
          docker run -d --name streamlit \
            --network host \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_DB=oura \
            -e POSTGRES_USER=oura \
            -e POSTGRES_PASSWORD=oura \
            -e OURA_TOKEN="" \
            -e USER_TIMEZONE=America/Toronto \
            oura-streamlit

      - name: Wait for Streamlit health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8501/_stcore/health > /dev/null 2>&1; then
              echo "Streamlit ready"
              exit 0
            fi
            sleep 2
          done
          echo "Streamlit did not become ready in time"
          docker logs streamlit
          exit 1
