name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Ruff check - ingestion
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: check ingestion/

      - name: Ruff check - streamlit
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: check streamlit/

      - name: Ruff format check - ingestion
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: format --check ingestion/

      - name: Ruff format check - streamlit
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: format --check streamlit/

      - name: Hadolint - ingestion/Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: ingestion/Dockerfile

      - name: Hadolint - streamlit/Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: streamlit/Dockerfile

      - name: Validate Grafana dashboard JSONs
        run: |
          python -c "
          import json, sys, pathlib
          errors = []
          for f in sorted(pathlib.Path('grafana/provisioning/dashboards-json').glob('*.json')):
              try:
                  d = json.loads(f.read_text())
                  for field in ('uid', 'title', 'panels'):
                      if field not in d:
                          errors.append(f'{f.name}: missing {field}')
                  for p in d.get('panels', []):
                      ds = p.get('datasource', {})
                      if isinstance(ds, dict) and ds.get('uid') and ds['uid'] != 'oura-pg':
                          errors.append(f'{f.name}: panel {p.get(\"id\")} bad datasource {ds[\"uid\"]}')
              except json.JSONDecodeError as e:
                  errors.append(f'{f.name}: invalid JSON - {e}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('All dashboard JSONs valid')
          "

      - name: YAML lint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: "."
          config_data: |
            extends: default
            rules:
              document-start: disable
              line-length:
                max: 200
              truthy:
                check-keys: false
              comments:
                min-spaces-from-content: 1

      - name: SQL lint - postgres/init.sql
        run: |
          python -c "
          import sys, pathlib, re
          sql = pathlib.Path('postgres/init.sql').read_text()
          errors = []
          lines = sql.splitlines()
          for i, line in enumerate(lines, 1):
              stripped = line.rstrip()
              if len(stripped) > 200:
                  errors.append(f'Line {i}: exceeds 200 chars ({len(stripped)})')
              if '\t' in line and not line.strip().startswith('--'):
                  errors.append(f'Line {i}: contains tab characters (use spaces)')
          if not sql.strip():
              errors.append('File is empty')
          if not re.search(r'CREATE\s+TABLE', sql, re.IGNORECASE):
              errors.append('No CREATE TABLE statements found')
          parens = 0
          for i, ch in enumerate(sql):
              if ch == '(':
                  parens += 1
              elif ch == ')':
                  parens -= 1
              if parens < 0:
                  errors.append(f'Unmatched closing parenthesis near character {i}')
                  break
          if parens > 0:
              errors.append(f'Unclosed parentheses: {parens} still open at end of file')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('SQL validation passed')
          "

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"
          allow-prereleases: true
          cache: pip
          cache-dependency-path: ingestion/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r ingestion/requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=oura_ingest \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  build:
    name: Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build all images
        run: |
          DOCKER_BUILDKIT=1 docker compose build \
            --build-arg BUILDKIT_INLINE_CACHE=1
        env:
          COMPOSE_DOCKER_CLI_BUILD: 1

  integration:
    name: Integration
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: |
          cp .env.example .env
          docker compose build

      - name: Start the full stack with docker compose
        run: docker compose up -d --wait --wait-timeout 120

      - name: Verify schema auto-applied on first boot (22 tables)
        run: |
          TABLE_COUNT=$(docker compose exec -T postgres \
            psql -U oura -d oura -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE'")
          echo "Tables found: $TABLE_COUNT"
          [ "$TABLE_COUNT" -eq 22 ] || { echo "Expected 22 tables, got $TABLE_COUNT"; exit 1; }

      - name: Verify indexes
        run: |
          INDEX_COUNT=$(docker compose exec -T postgres \
            psql -U oura -d oura -tAc \
            "SELECT count(*) FROM pg_indexes WHERE schemaname = 'public'")
          echo "Indexes found: $INDEX_COUNT"
          [ "$INDEX_COUNT" -ge 16 ] || { echo "Expected at least 16 indexes, got $INDEX_COUNT"; exit 1; }

      - name: Verify schema idempotency
        run: |
          docker compose exec -T postgres \
            psql -U oura -d oura -v ON_ERROR_STOP=1 \
            -f /docker-entrypoint-initdb.d/init.sql

      - name: Verify Grafana health
        run: |
          curl -sf http://localhost:3000/api/health \
            | python3 -c "import sys, json; d = json.load(sys.stdin); assert d.get('database') == 'ok', d; print('Grafana', d['version'])"

      - name: Verify dashboards provisioned
        run: |
          DASH_COUNT=$(curl -sf -u admin:admin 'http://localhost:3000/api/search?type=dash-db' \
            | python3 -c "import sys, json; print(len(json.load(sys.stdin)))")
          echo "Dashboards loaded: $DASH_COUNT"
          [ "$DASH_COUNT" -ge 5 ] || { echo "Expected at least 5 dashboards, got $DASH_COUNT"; exit 1; }

      - name: Verify datasource health (Grafana to PostgreSQL)
        run: |
          STATUS=$(curl -sf -u admin:admin http://localhost:3000/api/datasources/uid/oura-pg/health \
            | python3 -c "import sys, json; print(json.load(sys.stdin).get('status'))")
          echo "Datasource health: $STATUS"
          [ "$STATUS" = "OK" ] || { echo "Datasource unhealthy"; exit 1; }

      - name: Verify a dashboard query executes through the datasource
        run: |
          curl -sf -u admin:admin http://localhost:3000/api/ds/query \
            -H 'Content-Type: application/json' \
            -d '{"queries":[{"refId":"A","datasource":{"uid":"oura-pg"},"rawSql":"SELECT count(*) AS n FROM daily_sleep","format":"table"}],"from":"now-1h","to":"now"}' \
            | python3 -c "import sys, json; a = json.load(sys.stdin).get('results', {}).get('A', {}); assert not a.get('error'), a; assert a.get('frames'), a; print('Datasource query path OK')"

      - name: Verify Streamlit health
        run: curl -sf http://localhost:8501/_stcore/health && echo "Streamlit ready"

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
