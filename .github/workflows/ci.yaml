name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Ruff check - ingestion
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: check ingestion/

      - name: Ruff check - streamlit
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: check streamlit/

      - name: Ruff check - tests
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: check tests/

      - name: Ruff format check - ingestion
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: format --check ingestion/

      - name: Ruff format check - streamlit
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: format --check streamlit/

      - name: Ruff format check - tests
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: format --check tests/

      - name: Hadolint - ingestion/Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: ingestion/Dockerfile

      - name: Hadolint - streamlit/Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: streamlit/Dockerfile

      - name: Validate Grafana dashboard JSONs
        run: |
          python -c "
          import json, sys, pathlib
          errors = []
          for f in sorted(pathlib.Path('grafana/provisioning/dashboards-json').glob('*.json')):
              try:
                  d = json.loads(f.read_text())
                  for field in ('uid', 'title', 'panels'):
                      if field not in d:
                          errors.append(f'{f.name}: missing {field}')
                  for p in d.get('panels', []):
                      ds = p.get('datasource', {})
                      if isinstance(ds, dict) and ds.get('uid') and ds['uid'] != 'oura-pg':
                          errors.append(f'{f.name}: panel {p.get(\"id\")} bad datasource {ds[\"uid\"]}')
              except json.JSONDecodeError as e:
                  errors.append(f'{f.name}: invalid JSON - {e}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('All dashboard JSONs valid')
          "

      - name: YAML lint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: "."
          config_data: |
            extends: default
            rules:
              document-start: disable
              line-length:
                max: 200
              truthy:
                check-keys: false
              comments:
                min-spaces-from-content: 1

      - name: SQL lint - postgres/init.sql
        run: |
          python -c "
          import sys, pathlib, re
          sql = pathlib.Path('postgres/init.sql').read_text()
          errors = []
          lines = sql.splitlines()
          for i, line in enumerate(lines, 1):
              stripped = line.rstrip()
              if len(stripped) > 200:
                  errors.append(f'Line {i}: exceeds 200 chars ({len(stripped)})')
              if '\t' in line and not line.strip().startswith('--'):
                  errors.append(f'Line {i}: contains tab characters (use spaces)')
          if not sql.strip():
              errors.append('File is empty')
          if not re.search(r'CREATE\s+TABLE', sql, re.IGNORECASE):
              errors.append('No CREATE TABLE statements found')
          parens = 0
          for i, ch in enumerate(sql):
              if ch == '(':
                  parens += 1
              elif ch == ')':
                  parens -= 1
              if parens < 0:
                  errors.append(f'Unmatched closing parenthesis near character {i}')
                  break
          if parens > 0:
              errors.append(f'Unclosed parentheses: {parens} still open at end of file')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('SQL validation passed')
          "

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: oura
          POSTGRES_USER: oura
          POSTGRES_PASSWORD: oura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oura -d oura"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://oura:oura@localhost:5432/oura
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"
          allow-prereleases: true
          cache: pip
          cache-dependency-path: |
            ingestion/requirements.txt
            streamlit/requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pip install -r ingestion/requirements.txt
          pip install -r streamlit/requirements.txt
          pip install pytest pytest-cov

      - name: Apply PostgreSQL schema
        env:
          PGPASSWORD: oura
          GRAFANA_DB_PASSWORD: oura_grafana
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U oura -d oura \
            -f postgres/init.sql \
            -f postgres/configure-grafana-role.sql

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=oura_ingest \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  build:
    name: Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build all images
        run: |
          DOCKER_BUILDKIT=1 docker compose build \
            --build-arg BUILDKIT_INLINE_CACHE=1
        env:
          COMPOSE_DOCKER_CLI_BUILD: 1

  integration:
    name: Integration
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: |
          cp .env.example .env
          docker compose build

      - name: Start the full stack with docker compose
        run: docker compose up -d --wait --wait-timeout 120

      - name: Seed synthetic dashboard data
        run: |
          docker compose exec -T postgres \
            sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
            < postgres/ci-seed.sql

      - name: Verify schema auto-applied on first boot (22 tables)
        run: |
          TABLE_COUNT=$(docker compose exec -T postgres \
            psql -U oura -d oura -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE'")
          echo "Tables found: $TABLE_COUNT"
          [ "$TABLE_COUNT" -eq 22 ] || { echo "Expected 22 tables, got $TABLE_COUNT"; exit 1; }

      - name: Verify indexes
        run: |
          INDEX_COUNT=$(docker compose exec -T postgres \
            psql -U oura -d oura -tAc \
            "SELECT count(*) FROM pg_indexes WHERE schemaname = 'public'")
          echo "Indexes found: $INDEX_COUNT"
          [ "$INDEX_COUNT" -ge 16 ] || { echo "Expected at least 16 indexes, got $INDEX_COUNT"; exit 1; }

      - name: Verify schema idempotency
        run: |
          docker compose exec -T postgres \
            psql -U oura -d oura -v ON_ERROR_STOP=1 \
            -f /docker-entrypoint-initdb.d/10-init.sql \
            -f /docker-entrypoint-initdb.d/20-configure-grafana-role.sql

      - name: Verify Grafana health
        run: |
          curl -sf http://localhost:3000/api/health \
            | python3 -c "import sys, json; d = json.load(sys.stdin); assert d.get('database') == 'ok', d; print('Grafana', d['version'])"

      - name: Verify Grafana alert rules evaluate without errors
        run: |
          for _ in $(seq 1 30); do
            RULE_STATE=$(curl -sf http://localhost:3000/api/prometheus/grafana/api/v1/rules \
              | python3 -c "
          import json, sys
          groups = json.load(sys.stdin).get('data', {}).get('groups', [])
          rules = [rule for group in groups for rule in group.get('rules', [])]
          state = 'error' if any(rule.get('health') == 'error' for rule in rules) else 'wait'
          if rules and all(rule.get('health') in ('ok', 'nodata') for rule in rules):
              state = 'ok'
          print(state)
          ")
            [ "$RULE_STATE" = "error" ] && { echo "Grafana alert rule evaluation failed"; exit 1; }
            [ "$RULE_STATE" = "ok" ] && { echo "Grafana alert rules healthy"; break; }
            sleep 2
          done
          [ "$RULE_STATE" = "ok" ] || { echo "Grafana alert rules did not evaluate in time"; exit 1; }

      - name: Verify dashboards provisioned
        run: |
          DASH_COUNT=$(curl -sf -u admin:admin 'http://localhost:3000/api/search?type=dash-db' \
            | python3 -c "import sys, json; print(len(json.load(sys.stdin)))")
          echo "Dashboards loaded: $DASH_COUNT"
          [ "$DASH_COUNT" -ge 8 ] || { echo "Expected at least 8 dashboards, got $DASH_COUNT"; exit 1; }

      - name: Verify datasource health (Grafana to PostgreSQL)
        run: |
          STATUS=$(curl -sf -u admin:admin http://localhost:3000/api/datasources/uid/oura-pg/health \
            | python3 -c "import sys, json; print(json.load(sys.stdin).get('status'))")
          echo "Datasource health: $STATUS"
          [ "$STATUS" = "OK" ] || { echo "Datasource unhealthy"; exit 1; }

      - name: Verify a dashboard query executes through the datasource
        run: |
          curl -sf -u admin:admin http://localhost:3000/api/ds/query \
            -H 'Content-Type: application/json' \
            -d '{"queries":[{"refId":"A","datasource":{"uid":"oura-pg"},"rawSql":"SELECT count(*) AS n FROM daily_sleep","format":"table"}],"from":"now-1h","to":"now"}' \
            | python3 -c "import sys, json; a = json.load(sys.stdin).get('results', {}).get('A', {}); assert not a.get('error'), a; assert a.get('frames'), a; print('Datasource query path OK')"

      - name: Verify Streamlit health
        run: curl -sf http://localhost:8501/_stcore/health && echo "Streamlit ready"

      - name: Validate every Streamlit page in demo mode
        run: |
          STREAMLIT_IMAGE=$(docker compose images -q streamlit)
          docker run -d --name oura-streamlit-demo -p 127.0.0.1:8502:8501 "$STREAMLIT_IMAGE"
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8502/_stcore/health && break
            sleep 2
          done
          curl -sf http://localhost:8502/_stcore/health
          npm ci --prefix scripts
          ./scripts/node_modules/.bin/playwright install --with-deps chromium
          STREAMLIT_URL=http://localhost:8502 node scripts/validate-streamlit.mjs

      - name: Validate every Grafana dashboard and panel
        run: node scripts/validate-dashboards.mjs

      - name: Upload browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-validation
          path: |
            /tmp/streamlit
            /tmp/panels
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: |
          docker rm -f oura-streamlit-demo 2>/dev/null || true
          docker compose down -v
