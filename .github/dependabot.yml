version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      all:
        update-types:
          - major
          - minor
          - patch
    commit-message:
      prefix: ci
      include: scope
